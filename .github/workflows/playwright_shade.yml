name: Playwright Test (sharded)
on:
    push:
        branches: [main]
    # workflow_dispatch:
    # schedule:
    #     - cron: '0 2 * * *'
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        strategy: 
            fail-fast: false
            matrix:
                shardIndex: [1,2,3,4]
                shardTotal: [4]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: lts/*
                cache: 'npm'
            - name: Install Dependencies
              run: npm ci
            - name: Install Playwright browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              run: npx playwright test --shard=${{matrix.shardIndex}}/${{matrix.shardTotal}} --reporter=blob
            - name: Upload Playwright Test Results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                name: blob-report-${{matrix.shardIndex}}
                path: blob-report
                retention-days: 1
    merge-reports:
        if: ${{ !cancelled() }}
        needs: [test]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: lts/*
                cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Download the blob reports
              uses: actions/download-artifact@v4
              with:
                path: all-blob-reports
                pattern: blob-report-*
                merge-multiple: true
            - name: Merge the blob reports
              run: npx playwright merge-reports --reporter html ./all-blob-reports
            - name: upload the merged HTML report
              uses: actions/upload-artifact@v4
              with:
                name: html-report--attemp-${{ github.run_attempt}}
                path: playwright-reports
                retention-days: 14
            